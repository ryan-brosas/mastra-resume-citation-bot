name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Node 22 reports --experimental-strip-types on stderr; CLI tests reserve stderr for app failures.
      NODE_NO_WARNINGS: "1"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.3.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level moderate

      - name: Install PDF tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes poppler-utils

      - name: Require Chromium for browser tests
        shell: bash
        run: |
          chrome="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || true)"
          test -n "$chrome"
          mkdir -p "$HOME/.cache/ms-playwright/chromium-1234/chrome-linux64"
          ln -s "$chrome" "$HOME/.cache/ms-playwright/chromium-1234/chrome-linux64/chrome"
          test -x "$HOME/.cache/ms-playwright/chromium-1234/chrome-linux64/chrome"

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Verify citation assets
        run: pnpm citations:verify

      - name: Build
        run: pnpm build

      - name: Verify standalone artifact
        run: pnpm artifact:verify

      - name: Audit standalone artifact
        working-directory: .mastra/output
        run: npm audit --omit=dev --audit-level moderate
